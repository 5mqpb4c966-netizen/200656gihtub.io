<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食盲盒 - 拯救选择困难症</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #ff6b6b, #ffa36c);
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .food-display {
            padding: 40px 20px;
            text-align: center;
            background: #fff9f5;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px dashed #ffd8cc;
        }
        
        .food-name {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        
        .food-desc {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .controls {
            padding: 30px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ff8e6b);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .music-control:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        
        .quote {
            font-style: italic;
            color: #ff8e6b;
            margin-top: 20px;
            font-size: 1.1rem;
            text-align: center;
            padding: 0 20px;
        }
        
        .food-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ffd8cc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .rolling {
            animation: rolling 0.2s infinite;
        }
        
        @keyframes rolling {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        
        .category-selector {
            padding: 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        
        .category-title {
            text-align: center;
            margin-bottom: 15px;
            color: #666;
        }
        
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .category {
            padding: 8px 15px;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #ffd8cc;
        }
        
        .category.active {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }
        
        .history {
            padding: 20px;
            background: #f9f9f9;
        }
        
        .history-title {
            text-align: center;
            margin-bottom: 15px;
            color: #666;
        }
        
        .history-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 5px 12px;
            background: white;
            border-radius: 15px;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .food-name {
                font-size: 2rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍴 美食盲盒 🍴</h1>
            <p class="subtitle">拯救选择困难症的美食神器</p>
            <div class="music-control" id="musicControl">
                <span id="musicIcon">🎵</span>
            </div>
        </header>
        
        <div class="category-selector">
            <div class="category-title">选择美食类别：</div>
            <div class="categories" id="categories">
                <div class="category active" data-category="all">全部美食</div>
                <div class="category" data-category="chinese">中式美食</div>
                <div class="category" data-category="western">西式美食</div>
                <div class="category" data-category="snack">风味小吃</div>
                <div class="category" data-category="asian">亚洲料理</div>
            </div>
        </div>
        
        <div class="food-display">
            <div class="food-image" id="foodImage">🍜</div>
            <div class="food-name" id="foodName">点击开始，发现美食！</div>
            <div class="food-desc" id="foodDesc">让美食盲盒帮你决定今天吃什么，告别选择困难！</div>
            <div class="quote" id="quote">"人生苦短，再来一碗！"</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="startBtn">
                <span>🎲</span> 开始盲选
            </button>
            <button class="btn btn-secondary" id="stopBtn" disabled>
                <span>✅</span> 停止选择
            </button>
            <button class="btn btn-secondary" id="voiceBtn">
                <span>🔊</span> 语音提示
            </button>
        </div>
        
        <div class="history">
            <div class="history-title">今日美食记录：</div>
            <div class="history-list" id="historyList">
                <!-- 历史记录将在这里显示 -->
            </div>
        </div>
    </div>

    <!-- 音频元素 -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-food-relax-135.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="selectSound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="confirmSound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 美食数据库
        const foodDatabase = {
            all: [
                { name: "麻辣火锅", desc: "麻辣鲜香，暖心暖胃", emoji: "🍲", quote: "没有什么是一顿火锅解决不了的！" },
                { name: "意大利面", desc: "浓郁酱汁，意式风情", emoji: "🍝", quote: "生活需要一点意大利的浪漫～" },
                { name: "寿司拼盘", desc: "新鲜食材，精致美味", emoji: "🍣", quote: "一口一个，幸福满满！" },
                { name: "北京烤鸭", desc: "皮脆肉嫩，香气四溢", emoji: "🦆", quote: "皇家享受，平民价格！" },
                { name: "汉堡套餐", desc: "美式经典，能量满满", emoji: "🍔", quote: "简单粗暴的美味！" },
                { name: "酸菜鱼", desc: "酸辣开胃，鱼肉鲜嫩", emoji: "🐟", quote: "酸爽过瘾，停不下来！" },
                { name: "披萨", desc: "拉丝芝士，丰富配料", emoji: "🍕", quote: "分享的快乐，加倍的美味！" },
                { name: "牛肉拉面", desc: "手工拉面，汤鲜味美", emoji: "🍜", quote: "一碗下肚，元气满满！" },
                { name: "炸鸡啤酒", desc: "外酥里嫩，韩式风味", emoji: "🍗", quote: "来自星星的美味～" },
                { name: "麻辣小龙虾", desc: "麻辣过瘾，夜宵首选", emoji: "🦞", quote: "剥虾的乐趣，只有吃货懂！" },
                { name: "咖喱饭", desc: "浓郁咖喱，异国风情", emoji: "🍛", quote: "温暖你的胃和心～" },
                { name: "煎饼果子", desc: "天津特色，早餐佳选", emoji: "🥞", quote: "一口咬下，满满的幸福感！" }
            ],
            chinese: [
                { name: "麻辣火锅", desc: "麻辣鲜香，暖心暖胃", emoji: "🍲", quote: "没有什么是一顿火锅解决不了的！" },
                { name: "北京烤鸭", desc: "皮脆肉嫩，香气四溢", emoji: "🦆", quote: "皇家享受，平民价格！" },
                { name: "酸菜鱼", desc: "酸辣开胃，鱼肉鲜嫩", emoji: "🐟", quote: "酸爽过瘾，停不下来！" },
                { name: "牛肉拉面", desc: "手工拉面，汤鲜味美", emoji: "🍜", quote: "一碗下肚，元气满满！" },
                { name: "麻辣小龙虾", desc: "麻辣过瘾，夜宵首选", emoji: "🦞", quote: "剥虾的乐趣，只有吃货懂！" }
            ],
            western: [
                { name: "意大利面", desc: "浓郁酱汁，意式风情", emoji: "🍝", quote: "生活需要一点意大利的浪漫～" },
                { name: "汉堡套餐", desc: "美式经典，能量满满", emoji: "🍔", quote: "简单粗暴的美味！" },
                { name: "披萨", desc: "拉丝芝士，丰富配料", emoji: "🍕", quote: "分享的快乐，加倍的美味！" },
                { name: "牛排", desc: "肉质鲜嫩，汁水丰富", emoji: "🥩", quote: "高级享受，从一块牛排开始！" }
            ],
            snack: [
                { name: "煎饼果子", desc: "天津特色，早餐佳选", emoji: "🥞", quote: "一口咬下，满满的幸福感！" },
                { name: "臭豆腐", desc: "闻着臭吃着香", emoji: "🧆", quote: "勇敢者的美食！" },
                { name: "羊肉串", desc: "新疆风味，香气扑鼻", emoji: "🍢", quote: "一串接一串，根本停不下来！" },
                { name: "章鱼小丸子", desc: "日式小吃，外酥内软", emoji: "🐙", quote: "圆滚滚的美味！" }
            ],
            asian: [
                { name: "寿司拼盘", desc: "新鲜食材，精致美味", emoji: "🍣", quote: "一口一个，幸福满满！" },
                { name: "咖喱饭", desc: "浓郁咖喱，异国风情", emoji: "🍛", quote: "温暖你的胃和心～" },
                { name: "炸鸡啤酒", desc: "外酥里嫩，韩式风味", emoji: "🍗", quote: "来自星星的美味～" },
                { name: "冬阴功汤", desc: "泰式酸辣，开胃爽口", emoji: "🍲", quote: "酸辣鲜香，一秒到泰国！" }
            ]
        };

        // DOM元素
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const musicControl = document.getElementById('musicControl');
        const musicIcon = document.getElementById('musicIcon');
        const foodName = document.getElementById('foodName');
        const foodDesc = document.getElementById('foodDesc');
        const foodImage = document.getElementById('foodImage');
        const quote = document.getElementById('quote');
        const categories = document.getElementById('categories');
        const historyList = document.getElementById('historyList');
        
        // 音频元素
        const bgMusic = document.getElementById('bgMusic');
        const selectSound = document.getElementById('selectSound');
        const confirmSound = document.getElementById('confirmSound');
        
        // 语音合成
        const speech = new SpeechSynthesisUtterance();
        speech.lang = 'zh-CN';
        speech.rate = 1.0;
        speech.pitch = 1.0;
        
        // 程序状态
        let isSelecting = false;
        let selectInterval;
        let currentCategory = 'all';
        let history = [];
        
        // 初始化
        function init() {
            // 加载历史记录
            const savedHistory = localStorage.getItem('foodHistory');
            if (savedHistory) {
                history = JSON.parse(savedHistory);
                updateHistory();
            }
            
            // 设置分类点击事件
            document.querySelectorAll('.category').forEach(category => {
                category.addEventListener('click', function() {
                    document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.category;
                });
            });
            
            // 设置按钮事件
            startBtn.addEventListener('click', startSelection);
            stopBtn.addEventListener('click', stopSelection);
            voiceBtn.addEventListener('click', speakCurrentFood);
            musicControl.addEventListener('click', toggleMusic);
            
            // 尝试自动播放背景音乐（需要用户交互）
            bgMusic.volume = 0.3;
            selectSound.volume = 0.5;
            confirmSound.volume = 0.7;
            
            // 欢迎语
            setTimeout(() => {
                speakText("欢迎使用美食盲盒！点击开始按钮，让美食盲盒帮你决定今天吃什么！");
            }, 1000);
        }
        
        // 开始选择
        function startSelection() {
            isSelecting = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            foodImage.classList.add('rolling');
            
            // 播放选择音效
            selectSound.play();
            
            // 随机切换美食
            selectInterval = setInterval(() => {
                const foods = foodDatabase[currentCategory];
                const randomFood = foods[Math.floor(Math.random() * foods.length)];
                
                foodName.textContent = randomFood.name;
                foodDesc.textContent = randomFood.desc;
                foodImage.textContent = randomFood.emoji;
                quote.textContent = randomFood.quote;
            }, 100);
        }
        
        // 停止选择
        function stopSelection() {
            isSelecting = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            foodImage.classList.remove('rolling');
            foodImage.classList.add('pulse');
            
            clearInterval(selectInterval);
            
            // 播放确认音效
            confirmSound.play();
            
            // 添加到历史记录
            const selectedFood = {
                name: foodName.textContent,
                emoji: foodImage.textContent,
                time: new Date().toLocaleTimeString()
            };
            
            history.unshift(selectedFood);
            if (history.length > 6) history.pop();
            
            // 保存到本地存储
            localStorage.setItem('foodHistory', JSON.stringify(history));
            
            // 更新历史记录显示
            updateHistory();
            
            // 语音提示
            setTimeout(() => {
                speakText(`恭喜你选中了 ${foodName.textContent}，${foodDesc.textContent}，快去享用吧！`);
            }, 500);
            
            // 移除脉冲动画
            setTimeout(() => {
                foodImage.classList.remove('pulse');
            }, 2000);
        }
        
        // 语音播报当前美食
        function speakCurrentFood() {
            if (foodName.textContent !== "点击开始，发现美食！") {
                speakText(`当前选中的是 ${foodName.textContent}，${foodDesc.textContent}`);
            } else {
                speakText("请先开始选择美食");
            }
        }
        
        // 文本转语音
        function speakText(text) {
            speech.text = text;
            window.speechSynthesis.speak(speech);
        }
        
        // 切换音乐
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicIcon.textContent = "🔊";
                speakText("背景音乐已开启，享受美食时光！");
            } else {
                bgMusic.pause();
                musicIcon.textContent = "🔇";
                speakText("背景音乐已关闭");
            }
        }
        
        // 更新历史记录
        function updateHistory() {
            historyList.innerHTML = '';
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `${item.emoji} ${item.name} <small>${item.time}</small>`;
                historyList.appendChild(historyItem);
            });
        }
        
        // 初始化程序
        init();
    </script>
</body>
</html>
